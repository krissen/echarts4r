# R CMD check with the standard r-lib/actions v2 steps.
# Runs on the fork's working branch e_cloud__rectangle as well as main/master,
# so pull requests to the branch bifrost installs get a check. One Linux leg:
# the previous matrix used retired runner images (ubuntu-20.04) and
# actions/cache@v3, and macOS/Windows minutes are not needed for this fork.
on:
  push:
    branches:
      - main
      - master
      - e_cloud__rectangle
  pull_request:
    branches:
      - main
      - master
      - e_cloud__rectangle

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    name: ubuntu-latest (release)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
          upload-snapshots: true
